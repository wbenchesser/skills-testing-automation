name: sqli-detector-eval
description: Evaluate SQL injection vulnerability detection accuracy on OWASP benchmark
skill: sqli-detector

# Execution — case mode for single-item analysis
execution:
  mode: case
  arguments: "{prompt}\n\n{code}"

# Runner — Claude Code harness
runner:
  type: claude-code

# Models — defaults for eval runs
models:
  skill: claude-sonnet-4@20250514
  judge: claude-sonnet-4@20250514

# Permissions for headless execution
permissions:
  allow: []
  deny: ["**/reference.yaml"]  # Belt-and-suspenders: hide answer key from skill

# MLflow logging target
mlflow:
  experiment: skills-testing-automation-eval

# Dataset — shared OWASP benchmark cases
dataset:
  path: _dataset/cases
  schema: |
    Each case directory contains:
    - input.yaml: YAML file with three fields:
      * 'prompt': Instructions to analyze code for vulnerabilities and return a verdict
      * 'code': Java servlet code (comments stripped) to analyze for SQL injection
      * 'language': Programming language identifier (always "java")
    - reference.yaml: Ground truth labels (judge-only):
      * 'real_vulnerability': boolean — true if code contains exploitable SQL injection
      * 'cwe': integer (89 for SQL injection) or null
      * 'category': string — vulnerability category (e.g., "sqli")

# Outputs — stdout-only skill (conversation text, not files)
outputs:
  - path: output
    schema: |
      This is a stdout-only skill — output is produced via conversation text, not files.

      The skill returns a fenced code block in the conversation with this structure:
      ```verdict
      vulnerable: <true|false>
      cwe: <89 if SQL injection found, otherwise none>
      reasoning: <1-3 sentences explaining the analysis>
      ```

      Judges use {{ conversation }} to access this output (not {{ outputs }}).

# Traces — execution data to capture
traces:
  stdout: true
  stderr: true
  events: true
  metrics: true

# Judges — evaluate verdict correctness and reasoning quality
judges:
  # Check: Validate verdict block format
  - name: verdict_format
    description: |
      Validates that the conversation output contains a properly formatted verdict block
      with required fields (vulnerable, cwe, reasoning).
    check: |
      import re

      # Extract conversation text from outputs
      conversation = outputs.get("_conversation", "")

      # Look for verdict block
      verdict_match = re.search(r'```verdict\s*\n(.*?)\n```', conversation, re.DOTALL | re.IGNORECASE)
      if not verdict_match:
          return False, "No verdict block found in conversation"

      verdict_text = verdict_match.group(1)

      # Check for required fields
      has_vulnerable = re.search(r'vulnerable:\s*(true|false)', verdict_text, re.IGNORECASE)
      has_cwe = re.search(r'cwe:\s*(\d+|none|null)', verdict_text, re.IGNORECASE)
      has_reasoning = re.search(r'reasoning:\s*(.+)', verdict_text, re.IGNORECASE | re.DOTALL)

      if not has_vulnerable:
          return False, "Missing 'vulnerable' field"
      if not has_cwe:
          return False, "Missing 'cwe' field"
      if not has_reasoning:
          return False, "Missing 'reasoning' field"

      return True, "Verdict block properly formatted"

  # Check: Classification correctness with confusion matrix
  - name: verdict_correct
    description: |
      Skill's vulnerable verdict matches the OWASP label; also emits
      confusion-matrix cell for precision/recall calculation.
    check: |
      import re
      import yaml
      from pathlib import Path

      # Load ground truth from reference.yaml
      case_dir = outputs.get("_case_dir", "")
      if not case_dir:
          return False, "Case directory not available"

      ref_path = Path(case_dir) / "reference.yaml"
      if not ref_path.exists():
          return False, f"reference.yaml not found at {ref_path}"

      with open(ref_path) as f:
          ref = yaml.safe_load(f)

      # Extract predicted verdict from conversation
      conversation = outputs.get("_conversation", "")
      verdict_match = re.search(r'```verdict\s*\n(.*?)\n```', conversation, re.DOTALL | re.IGNORECASE)
      if not verdict_match:
          return False, "No parseable verdict in conversation"

      verdict_text = verdict_match.group(1)
      vuln_match = re.search(r'vulnerable:\s*(true|false)', verdict_text, re.IGNORECASE)
      if not vuln_match:
          return False, "No vulnerable field found in verdict"

      # Parse prediction and ground truth
      pred = vuln_match.group(1).lower() == "true"
      gold = bool(ref.get("real_vulnerability", False))

      # Determine confusion matrix cell
      if pred and gold:
          cell = "TP"
      elif pred and not gold:
          cell = "FP"
      elif not pred and gold:
          cell = "FN"
      else:
          cell = "TN"

      ok = pred == gold
      cwe = ref.get("cwe", "null")

      return ok, f"{cell} (pred={pred}, gold={gold}, cwe={cwe})"

  # LLM: Reasoning quality assessment
  - name: reasoning_quality
    description: |
      Evaluates whether reasoning is grounded in executable logic (data flow,
      parameterization patterns) rather than comments or generic principles.
      Scores 1-5.
    prompt: |
      You are evaluating the quality of an SQL injection vulnerability analysis.

      GROUND TRUTH (from reference.yaml):
      {% if annotations %}
      - Real vulnerability: {{ annotations.real_vulnerability }}
      - CWE: {{ annotations.cwe }}
      - Category: {{ annotations.category }}
      {% else %}
      (No annotations available)
      {% endif %}

      AGENT OUTPUT (from conversation):
      {{ conversation }}

      Evaluate ONLY the reasoning quality, ignoring whether the verdict was correct:

      SCORING CRITERIA (1-5):

      5 = Excellent reasoning:
          - Cites concrete code patterns (PreparedStatement vs Statement.executeQuery)
          - References specific data flow (request.getParameter → SQL query)
          - Mentions parameterization (? placeholders, setString) or concatenation (+ operator)
          - Grounded in executable logic, not comments

      4 = Good reasoning:
          - Identifies key patterns (parameterized vs concatenated queries)
          - Mentions user input flow
          - Mostly grounded in code, minor generic statements

      3 = Adequate reasoning:
          - Correctly identifies whether safe or vulnerable
          - Some reference to patterns, but lacks specificity
          - May include generic security principles alongside code analysis

      2 = Weak reasoning:
          - Generic statements about SQL injection
          - Minimal code-specific evidence
          - May rely on comments or non-executable text

      1 = Poor reasoning:
          - No code-specific evidence
          - Generic security advice
          - Based on comments rather than executable logic

      Return ONLY a number from 1 to 5 and a brief explanation (1-2 sentences).

# Thresholds for regression detection
thresholds:
  verdict_format:
    min_pass_rate: 0.95
  verdict_correct:
    min_pass_rate: 0.7
  reasoning_quality:
    min_mean: 3.5
