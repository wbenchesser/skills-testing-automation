name: sqli-detector-benchmark
description: SQL injection vulnerability detection against OWASP Benchmark
skill: sqli-detector

# Execution — case-by-case analysis
execution:
  mode: case
  arguments: "{prompt}\n\n{code}"
  timeout: 600
  parallelism: 3

# Runner configuration
runner:
  type: claude-code
  settings:
    traces:
      conversation: true
      stdout: true
      stderr: true

# Models for evaluation
models:
  skill: claude-sonnet-4@20250514
  judge: claude-sonnet-4@20250514

# Permissions — skill is pure LLM analysis, no tools needed
permissions:
  allow: []
  deny: ["**/reference.yaml"]  # Prevent skill from reading ground truth

# MLflow tracking
mlflow:
  experiment: sqli-detector-eval

# Dataset structure
dataset:
  path: /Users/bchesser/Projects/Skills-Testing-Automation/skills-testing-automation/eval/_dataset/cases
  schema: |
    Each test case directory contains:
    - input.yaml: Contains three fields:
      - prompt (string): Instructions to analyze code and output verdict in fenced block
      - code (string): Java source code with comments stripped
      - language (string): Always "java"
    - reference.yaml: Ground truth labels (judge-only, denied to skill):
      - real_vulnerability (boolean): True if code has exploitable SQL injection
      - cwe (number or null): 89 for SQL injection, null otherwise
      - category (string): Vulnerability category (e.g., "sqli")

# No tool interception needed — pure LLM analysis
inputs:
  tools: []

# Output structure
outputs:
  - path: output
    schema: |
      STDOUT-ONLY SKILL: No file artifacts produced. Skill outputs verdict
      via conversation text in a fenced code block:

      ```verdict
      vulnerable: <true|false>
      cwe: <89 or none>
      reasoning: <1-3 sentences explaining analysis>
      ```

      Judges must use {{ conversation }} template variable to access this output.

# Judges — detection accuracy + reasoning quality
judges:
  - name: verdict_format
    description: Verify verdict block is properly formatted with all required fields
    type: check
    check: |
      import re
      conversation = outputs.get("_conversation", "")
      verdict_match = re.search(r'```verdict\s*\n(.*?)\n```', conversation, re.DOTALL | re.IGNORECASE)
      if not verdict_match:
          return False, "No verdict block found in conversation"
      verdict_text = verdict_match.group(1)
      has_vulnerable = re.search(r'vulnerable:\s*(true|false)', verdict_text, re.IGNORECASE)
      has_cwe = re.search(r'cwe:\s*(\d+|none|null)', verdict_text, re.IGNORECASE)
      has_reasoning = re.search(r'reasoning:\s*(.+)', verdict_text, re.IGNORECASE | re.DOTALL)
      if not has_vulnerable:
          return False, "Missing 'vulnerable' field"
      if not has_cwe:
          return False, "Missing 'cwe' field"
      if not has_reasoning:
          return False, "Missing 'reasoning' field"
      return True, "Verdict block properly formatted"

  - name: verdict_correct
    description: Compare skill verdict against OWASP benchmark ground truth, compute confusion matrix
    type: check
    check: |
      import re, yaml
      from pathlib import Path
      case_dir = outputs.get("_case_dir", "")
      if not case_dir:
          return False, "Case directory not available"
      ref_path = Path(case_dir) / "reference.yaml"
      if not ref_path.exists():
          return False, f"reference.yaml not found at {ref_path}"
      with open(ref_path) as f:
          ref = yaml.safe_load(f)
      conversation = outputs.get("_conversation", "")
      verdict_match = re.search(r'```verdict\s*\n(.*?)\n```', conversation, re.DOTALL | re.IGNORECASE)
      if not verdict_match:
          return False, "No parseable verdict in conversation"
      verdict_text = verdict_match.group(1)
      vuln_match = re.search(r'vulnerable:\s*(true|false)', verdict_text, re.IGNORECASE)
      if not vuln_match:
          return False, "No vulnerable field found in verdict"
      pred = vuln_match.group(1).lower() == "true"
      gold = bool(ref.get("real_vulnerability", False))
      if pred and gold:
          cell = "TP"
      elif pred and not gold:
          cell = "FP"
      elif not pred and gold:
          cell = "FN"
      else:
          cell = "TN"
      ok = pred == gold
      cwe = ref.get("cwe", "null")
      testname = Path(case_dir).name
      return ok, f"{cell} (pred={pred}, gold={gold}, cwe={cwe}, case={testname})"

  - name: reasoning_quality
    description: Score reasoning quality (1-5) based on code-grounded analysis vs superficial patterns
    type: llm
    prompt: |
      The agent was asked to judge whether Java code contains a SQL injection vulnerability
      using ONLY executable logic and data flow analysis, explicitly ignoring code comments.

      Rate the agent's reasoning quality on a scale of 1-5:
      - 5: Excellent - cites specific data flow from untrusted input to SQL query, mentions
        string concatenation vs parameterization, references actual variable/method names
      - 4: Good - identifies key vulnerability patterns with some specificity
      - 3: Adequate - correct general pattern but lacks concrete code references
      - 2: Weak - vague reasoning or appears to guess
      - 1: Poor - relies on comments, makes unfounded claims, or shows no understanding

      GROUND TRUTH (from OWASP benchmark reference.yaml):
      {% if annotations %}
      - Real vulnerability: {{ annotations.real_vulnerability }}
      - CWE: {{ annotations.cwe }}
      - Category: {{ annotations.category }}
      {% else %}
      (No annotations available)
      {% endif %}

      AGENT OUTPUT (from conversation):
      {{ conversation }}

      Return ONLY a JSON object with this structure:
      {
        "score": <number 1-5>,
        "rationale": "<1-2 sentences explaining your rating>"
      }

# Thresholds for pass/fail
thresholds:
  verdict_format:
    min_pass_rate: 1.0
  verdict_correct:
    min_pass_rate: 0.7
  reasoning_quality:
    min_mean: 3.5
